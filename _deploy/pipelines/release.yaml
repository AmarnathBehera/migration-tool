# XbyK Web Publish and Release Pipeline
# Builds, packages, and pushes GWTXbyKWeb to Octopus Deploy, then creates a release.

name: XbyK Web Publish and Release

# Trigger on main, development and Release/* branches
trigger:
  branches:
    include:
      - main
      - development
      - "Release/*"

resources:
  pipelines:
    - pipeline: XbyKUIValidation
      source: "GWT.XbyK.UI - Build and Test"
      trigger:
        branches:
          include:
            - main

  repositories:
    - repository: GWT.XbyK.UI
      type: git
      name: "Global Website/GWT.XbyK.UI"
      ref: main

    - repository: GWT.XbyK.ReactServer
      type: git
      name: "Global Website/GWT.XbyK.ReactServer"
      ref: main

variables:
  buildConfiguration: "Release"
  dotnetVersion: "10.x"
  publishOutput: "$(Build.ArtifactStagingDirectory)/publish"
  octopusSpaceName: "GWT"
  octopusProjectName: "GWT XbyK Web"
  octopusPackageOutput: "$(Build.ArtifactStagingDirectory)/packages"

  # Solution file name (used with $(Build.SourcesDirectory) in single-checkout jobs)
  solutionFile: "GWTXbyKWeb.slnx"

  # XbyK App Deploy packages
  cmsAppPackageId: "GWT.XbyK.CMS.Deploy"
  mvcAppPackageId: "GWT.XbyK.MVC.Deploy"
  # reactAppPackageId: 'GWT.XbyK.React.Deploy'
  # synAppPackageId: 'GWT.XbyK.Sync.Deploy'
  # apiAppPackageId: 'GWT.XbyK.API.Deploy'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: SetVersion
        displayName: Set Release Version
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: gitversion-setup@4
            displayName: Install GitVersion
            inputs:
              versionSpec: "6.4.x"

          - task: gitversion-execute@4
            name: SetVersion
            displayName: Run GitVersion

          - script: |
              echo "Derived FullSemVer: $(GitVersion_FullSemVer)"
              newBuildNumber=$(echo "$(GitVersion_FullSemVer)" | sed 's/+/\./g')
              echo "##vso[build.updatebuildnumber]$newBuildNumber"
            displayName: Update build number

          - bash: |
              echo "##vso[task.setvariable variable=PreReleaseNumber;isOutput=true]$(GitVersion_PreReleaseNumber)"
              echo "##vso[task.setvariable variable=FullSemVer;isOutput=true]$(GitVersion_FullSemVer)"
              echo "##vso[task.setvariable variable=MajorMinorPatch;isOutput=true]$(GitVersion_MajorMinorPatch)"
            name: SetGitVersionVars
            displayName: Export GitVersion variables

      - job: BuildCmsApp
        displayName: "Build and package XbyK CMS App"
        dependsOn: SetVersion
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: "Use .NET $(dotnetVersion)"
            inputs:
              packageType: "sdk"
              version: "$(dotnetVersion)"
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - task: NuGetAuthenticate@1
            displayName: "Authenticate NuGet"

          - script: dotnet restore $(Build.SourcesDirectory)/$(solutionFile)
            displayName: "Restore NuGet packages"

          - script: >
              dotnet build $(Build.SourcesDirectory)/$(solutionFile)
              --configuration $(buildConfiguration)
              --no-restore
            displayName: "Build solution"

          - script: >
              dotnet publish $(Build.SourcesDirectory)/$(solutionFile)
              --configuration $(buildConfiguration)
              --no-build
              --output $(publishOutput)
            displayName: "Publish solution"

          - task: ArchiveFiles@2
            displayName: "Create CMS deployment package"
            inputs:
              rootFolderOrFile: "$(publishOutput)"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(octopusPackageOutput)/$(cmsAppPackageId).$(Build.BuildNumber).zip"
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: "Publish CMS package artifact"
            inputs:
              targetPath: "$(octopusPackageOutput)"
              artifact: drop-cms

      - job: BuildMvcApp
        displayName: "Build and package XbyK MVC App"
        dependsOn: SetVersion
        pool:
          vmImage: "ubuntu-latest"
        variables:
          # In multi-checkout mode, 'self' is placed in a subdirectory named after the repository
          selfSourcesDirectory: "$(Build.SourcesDirectory)/GWT.XbyK.Web"
        steps:
          - checkout: self
          - checkout: GWT.XbyK.UI

          - task: UseDotNet@2
            displayName: "Use .NET $(dotnetVersion)"
            inputs:
              packageType: "sdk"
              version: "$(dotnetVersion)"
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - task: NuGetAuthenticate@1
            displayName: "Authenticate NuGet"

          - script: dotnet restore $(selfSourcesDirectory)/$(solutionFile)
            displayName: "Restore NuGet packages"

          - task: NodeTool@0
            displayName: "Install Node.js"
            inputs:
              versionSpec: "22.x"

          - task: Npm@1
            displayName: "Install GWT.XbyK.UI dependencies"
            inputs:
              command: "install"
              workingDir: "$(Build.SourcesDirectory)/GWT.XbyK.UI"

          - task: Npm@1
            displayName: "Build GWT.XbyK.UI assets"
            inputs:
              command: "custom"
              workingDir: "$(Build.SourcesDirectory)/GWT.XbyK.UI"
              customCommand: "run build:production"

          - script: >
              dotnet build $(selfSourcesDirectory)/$(solutionFile)
              --configuration $(buildConfiguration)
              --no-restore
            displayName: "Build solution"

          - script: >
              dotnet publish $(selfSourcesDirectory)/$(solutionFile)
              --configuration $(buildConfiguration)
              --no-build
              --output $(publishOutput)
            displayName: "Publish solution"

          - task: CopyFiles@2
            displayName: "Copy UI assets to MVC wwwroot"
            inputs:
              SourceFolder: "$(Build.SourcesDirectory)/GWT.XbyK.UI/wwwroot/dist"
              Contents: "**"
              TargetFolder: "$(publishOutput)/wwwroot/dist"
              OverWrite: true

          - task: ArchiveFiles@2
            displayName: "Create MVC deployment package"
            inputs:
              rootFolderOrFile: "$(publishOutput)"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(octopusPackageOutput)/$(mvcAppPackageId).$(Build.BuildNumber).zip"
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: "Publish MVC package artifact"
            inputs:
              targetPath: "$(octopusPackageOutput)"
              artifact: drop-mvc

  - stage: Publish
    displayName: Publish to Octopus
    dependsOn: Build
    variables:
      GitVersion_PreReleaseNumber: $[ stageDependencies.Build.SetVersion.outputs['SetGitVersionVars.PreReleaseNumber'] ]
      GitVersion_FullSemVer: $[ stageDependencies.Build.SetVersion.outputs['SetGitVersionVars.FullSemVer'] ]
      GitVersion_MajorMinorPatch: $[ stageDependencies.Build.SetVersion.outputs['SetGitVersionVars.MajorMinorPatch'] ]
    jobs:
      - job: Publish
        displayName: Publish to Octopus
        pool:
          vmImage: ubuntu-latest
        steps:
          - download: current
            artifact: drop-cms
          - download: current
            artifact: drop-mvc

          - task: OctopusPush@7
            displayName: Push Packages to Octopus
            inputs:
              OctoConnectedServiceName: "Octopus Cloud"
              Space: "$(octopusSpaceName)"
              Packages: |
                $(Pipeline.Workspace)/drop-cms/*.zip
                $(Pipeline.Workspace)/drop-mvc/*.zip
              Replace: "true"

          - task: OctopusBuildInformation@7
            displayName: Push Package Build Information to Octopus
            inputs:
              OctoConnectedServiceName: "Octopus Cloud"
              Space: "$(octopusSpaceName)"
              PackageIds: |
                $(cmsAppPackageId)
                $(mvcAppPackageId)
              PackageVersion: "$(Build.BuildNumber)"
              Replace: OverwriteExisting

          # Create release on 'Pre-Release' channel for main branch, and 'Stable' channel for Release/* branches
          - task: OctopusCreateRelease@7
            displayName: Create Octopus Release on Pre-Release Channel
            condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/heads/Release/')))
            continueOnError: true
            inputs:
              OctoConnectedServiceName: "Octopus Cloud"
              Space: "$(octopusSpaceName)"
              Project: "$(octopusProjectName)"
              ReleaseNumber: "$(Build.BuildNumber)"
              Channel: "Pre-Release"
              DefaultPackageVersion: "$(Build.BuildNumber)"
              GitRef: "$(Build.SourceBranch)"
              ReleaseNotes: "**Branch:** $(Build.SourceBranchName)<br>**Commit:** $(Build.SourceVersionMessage)<br>**Build Reason:** $(Build.Reason)<br>**Link:** $(Build.Repository.Uri)"

          - task: OctopusCreateRelease@7
            displayName: Create Octopus Release on Stable Channel
            condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/Release/'))
            inputs:
              OctoConnectedServiceName: "Octopus Cloud"
              Space: "$(octopusSpaceName)"
              Project: "$(octopusProjectName)"
              ReleaseNumber: "$(Build.BuildNumber)"
              Channel: "Stable"
              DefaultPackageVersion: "$(Build.BuildNumber)"
              GitRef: "$(Build.SourceBranch)"
              ReleaseNotes: "**Branch:** $(Build.SourceBranchName)<br>**Commit:** $(Build.SourceVersionMessage)<br>**Build Reason:** $(Build.Reason)<br>**Link:** $(Build.Repository.Uri)"
