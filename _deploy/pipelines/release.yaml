# GWT.XbyK Release pipeline
# This pipeline is triggered by successful completion of the 'Build and Test' pipelines in the GWT.XbyK.Web, GWT.XbyK.UI, and GWT.XbyK.ReactServer repositories for main and release branches.
# Pipeline can be executed manually also.

name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none

resources:
  repositories:
    - repository: GWT.XbyK.UI
      type: git
      name: "Global Website/GWT.XbyK.UI"
      ref: main

    - repository: GWT.XbyK.ReactServer
      type: git
      name: "Global Website/GWT.XbyK.ReactServer"
      ref: main

  pipelines:
    - pipeline: XbyKWebBuildTest
      source: "GWT.XbyK.Web\\GWT.XbyK.Web - Build and Test"
      trigger:
        branches:
          include:
            - main
            - "Release/*"

    - pipeline: XbyKUIBuildTest
      source: "GWT.XbyK.UI\\GWT.XbyK.UI - Build and Test"
      trigger:
        branches:
          include:
            - main
            - "Release/*"

    - pipeline: XbyKReactServerBuildTest
      source: "GWT.XbyK.ReactServer\\GWT.XbyK.ReactServer - Build and Test"
      trigger:
        branches:
          include:
            - main
            - "Release/*"

variables:
  # Pipeline Variables
  - group: gwt.xbyk

  # Dotnet Build variables
  - name: buildConfiguration
    value: "Release"
  - name: dotnetVersion
    value: "10.x"
  - name: publishOutput
    value: "$(Build.ArtifactStagingDirectory)/publish"

  # Project file paths; relative to the repository root, used for dotnet build/publish and to determine which projects to package for Octopus Deploy.
  # In multi-repo checkout scenarios, the repository root is the subdirectory named after the repository (e.g. $(Build.SourcesDirectory)/GWT.XbyK.Web/)
  - name: cmsProjectFilePath
    value: "BDO.GWT.GLOBAL/GWTXbyKWeb.csproj"
  - name: mvcProjectFilePath
    value: "BDO.GWT.GLOBAL/GWTXbyKWeb.csproj"

  # Octopus Deploy variables
  - name: octopusSpaceName
    value: "GWT"
  - name: octopusProjectName
    value: "GWT XbyK Web"
  - name: octopusPackageOutput
    value: "$(Build.ArtifactStagingDirectory)/packages"
  - name: cmsAppPackageId
    value: "GWT.XbyK.CMS.Deploy"
  - name: mvcAppPackageId
    value: "GWT.XbyK.MVC.Deploy"
  - name: reactAppPackageId
    value: "GWT.XbyK.React.Deploy"
  - name: ciAppPackageId
    value: "GWT.XbyK.CI.Deploy"
  # - name: synAppPackageId
  #   value: "GWT.XbyK.Sync.Deploy"
  # - name: apiAppPackageId
  #   value: "GWT.XbyK.API.Deploy"

stages:
  - stage: Versioning
    displayName: "Set Version"
    jobs:
      - job: SetVersion
        displayName: "Set Build Number and Release Version"
        steps:
          - checkout: none

          - script: |
              # Determine which GWT repo triggered the build and updates package details and release notes accordingly.
              # This allows a single release pipeline for multi-repo development and a single Octopus Deploy project for deployment.
              # $(Resources.TriggeringAlias) is a predefined variable set to the pipeline resource alias (e.g. XbyKWebBuildTest)
              # when Build.Reason=ResourceTrigger. It is empty for manual runs.

              case "$(Resources.TriggeringAlias)" in
                *Web*)
                  repo="web"
                  triggerBranch="$RESOURCES_PIPELINE_XBYKWEBBUILDTEST_SOURCEBRANCH"
                  triggerRunId="$RESOURCES_PIPELINE_XBYKWEBBUILDTEST_RUNID"
                  ;;
                *UI*)
                  repo="ui"
                  triggerBranch="$RESOURCES_PIPELINE_XBYKUIBUILDTEST_SOURCEBRANCH"
                  triggerRunId="$RESOURCES_PIPELINE_XBYKUIBUILDTEST_RUNID"
                  ;;
                *ReactServer*)
                  repo="reactserver"
                  triggerBranch="$RESOURCES_PIPELINE_XYKREACTSERVERBUILDTEST_SOURCEBRANCH"
                  triggerRunId="$RESOURCES_PIPELINE_XYKREACTSERVERBUILDTEST_RUNID"
                  ;;
                *)
                  repo="manual"
                  triggerBranch=""
                  triggerRunId=""
                  ;;
              esac

              # Use GWT Project Variable group 'gwt.xbyk' to determine versioning and build numbering strategy.
              if [ "$(currentVersion)" = "$(stableVersion)" ]; then
                isStable=true
                channel="Stable"
                suffix="stable"
                releaseNumber="$(stableVersion)"
                newBuildNumber="$(stableVersion)-$(Build.BuildId)-${suffix}-${repo}"
              else
                isStable=false
                channel="Pre-Release"
                suffix="ci"
                releaseNumber="$(currentVersion)-$(Build.BuildId)-${suffix}-${repo}"
                newBuildNumber="${releaseNumber}"
              fi

              # Resolve triggering details
              if [ -z "$(Resources.TriggeringAlias)" ]; then
                triggerDetails="Manual run by $(Build.RequestedFor)"
              else
                triggerDetails="$(Resources.TriggeringAlias) / $triggerBranch / Build: $triggerRunId"
              fi

              echo "##vso[task.setvariable variable=triggerDetails;isOutput=true]$triggerDetails"
              echo "##vso[build.updatebuildnumber]$newBuildNumber"
              echo "##vso[task.setvariable variable=releaseNumber;isOutput=true]$releaseNumber"
              echo "##vso[task.setvariable variable=octopusChannel;isOutput=true]$channel"
              echo "##vso[task.setvariable variable=isStable;isOutput=true]$isStable"
            name: setVersion
            displayName: "Set release version"

  - stage: Build
    displayName: Build
    dependsOn: Versioning
    variables:
      releaseNumber: $[
        stageDependencies.Versioning.SetVersion.outputs['setVersion.releaseNumber']
        ]
      octopusChannel: $[
        stageDependencies.Versioning.SetVersion.outputs['setVersion.octopusChannel']
        ]
      isStable: $[
        stageDependencies.Versioning.SetVersion.outputs['setVersion.isStable'] ]

    jobs:
      - job: BuildCmsApp
        displayName: "Build and package XbyK CMS App"
        pool:
          vmImage: "ubuntu-latest"
        variables:
          # In multi-checkout mode, 'self' is placed in a subdirectory named after the repository
          selfSourcesDirectory: "$(Build.SourcesDirectory)/GWT.XbyK.Web"
        steps:
          - checkout: self
          - checkout: GWT.XbyK.UI

          - task: UseDotNet@2
            displayName: "Use .NET $(dotnetVersion)"
            inputs:
              packageType: "sdk"
              version: "$(dotnetVersion)"
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - task: NuGetAuthenticate@1
            displayName: "Authenticate NuGet"

          - script: dotnet restore $(selfSourcesDirectory)/$(cmsProjectFilePath)
            displayName: "Restore NuGet packages"

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "22.x"

          - task: Npm@1
            displayName: "Install GWT.XbyK.UI dependencies"
            inputs:
              command: "install"
              workingDir: "$(Build.SourcesDirectory)/GWT.XbyK.UI"

          - task: Npm@1
            displayName: "Build GWT.XbyK.UI assets"
            inputs:
              command: "custom"
              workingDir: "$(Build.SourcesDirectory)/GWT.XbyK.UI"
              customCommand: "run build:production"

          - script: >
              dotnet build $(selfSourcesDirectory)/$(cmsProjectFilePath)
              --configuration $(buildConfiguration) --no-restore
            displayName: "Build solution"

          - script: >
              dotnet publish $(selfSourcesDirectory)/$(cmsProjectFilePath)
              --configuration $(buildConfiguration) --no-build --output
              $(publishOutput)
            displayName: "Publish solution"

          - task: CopyFiles@2
            displayName: "Copy UI assets to CMS wwwroot"
            inputs:
              SourceFolder: "$(Build.SourcesDirectory)/GWT.XbyK.UI/wwwroot/dist"
              Contents: "**"
              TargetFolder: "$(publishOutput)/wwwroot/dist"
              OverWrite: true

          - task: ArchiveFiles@2
            displayName: "Create CMS deployment package"
            inputs:
              rootFolderOrFile: "$(publishOutput)"
              includeRootFolder: false
              archiveType: zip
              archiveFile:
                "$(octopusPackageOutput)/$(cmsAppPackageId).$(Build.BuildNumber).z\
                ip"
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: "Publish CMS package artifact"
            inputs:
              targetPath: "$(octopusPackageOutput)"
              artifact: drop-cms

      - job: BuildMvcApp
        displayName: "Build and package XbyK MVC App"
        pool:
          vmImage: "ubuntu-latest"
        variables:
          # In multi-checkout mode, 'self' is placed in a subdirectory named after the repository
          selfSourcesDirectory: "$(Build.SourcesDirectory)/GWT.XbyK.Web"
        steps:
          - checkout: self
          - checkout: GWT.XbyK.UI

          - task: UseDotNet@2
            displayName: "Use .NET $(dotnetVersion)"
            inputs:
              packageType: "sdk"
              version: "$(dotnetVersion)"
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - task: NuGetAuthenticate@1
            displayName: "Authenticate NuGet"

          - script: dotnet restore $(selfSourcesDirectory)/$(mvcProjectFilePath)
            displayName: "Restore NuGet packages"

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "22.x"

          - task: Npm@1
            displayName: "Install GWT.XbyK.UI dependencies"
            inputs:
              command: "install"
              workingDir: "$(Build.SourcesDirectory)/GWT.XbyK.UI"

          - task: Npm@1
            displayName: "Build GWT.XbyK.UI assets"
            inputs:
              command: "custom"
              workingDir: "$(Build.SourcesDirectory)/GWT.XbyK.UI"
              customCommand: "run build:production"

          - script: >
              dotnet build $(selfSourcesDirectory)/$(mvcProjectFilePath)
              --configuration $(buildConfiguration) --no-restore
            displayName: "Build solution"

          - script: >
              dotnet publish $(selfSourcesDirectory)/$(mvcProjectFilePath)
              --configuration $(buildConfiguration) --no-build --output
              $(publishOutput)
            displayName: "Publish solution"

          - task: CopyFiles@2
            displayName: "Copy UI assets to MVC wwwroot"
            inputs:
              SourceFolder: "$(Build.SourcesDirectory)/GWT.XbyK.UI/wwwroot/dist"
              Contents: "**"
              TargetFolder: "$(publishOutput)/wwwroot/dist"
              OverWrite: true

          - task: ArchiveFiles@2
            displayName: "Create MVC deployment package"
            inputs:
              rootFolderOrFile: "$(publishOutput)"
              includeRootFolder: false
              archiveType: zip
              archiveFile:
                "$(octopusPackageOutput)/$(mvcAppPackageId).$(Build.BuildNumber).z\
                ip"
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: "Publish MVC package artifact"
            inputs:
              targetPath: "$(octopusPackageOutput)"
              artifact: drop-mvc

      - job: BuildCIPackage
        displayName: "Build and package XbyK CI Deploy"
        pool:
          vmImage: "ubuntu-latest"
        variables:
          selfSourcesDirectory: "$(Build.SourcesDirectory)"
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: "Use .NET $(dotnetVersion)"
            inputs:
              packageType: "sdk"
              version: "$(dotnetVersion)"
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - task: NuGetAuthenticate@1
            displayName: "Authenticate NuGet"

          - script: dotnet restore $(selfSourcesDirectory)/$(cmsProjectFilePath)
            displayName: "Restore NuGet packages"

          - script: >
              dotnet publish $(selfSourcesDirectory)/$(cmsProjectFilePath)
              --configuration $(buildConfiguration) --no-restore --output
              $(publishOutput)
            displayName: "Publish CMS project for CI runner"

          - task: CopyFiles@2
            displayName: "Copy CIRepository to CI package output"
            inputs:
              SourceFolder: "$(selfSourcesDirectory)/BDO.GWT.GLOBAL/App_Data/CIRepository"
              Contents: "**"
              TargetFolder: "$(publishOutput)/App_Data/CIRepository"
              OverWrite: true

          - task: CopyFiles@2
            displayName: "Copy CI restore script to CI package output"
            inputs:
              SourceFolder: "$(selfSourcesDirectory)/_deploy/scripts"
              Contents: "Invoke-KenticoCIRestore.ps1"
              TargetFolder: "$(publishOutput)"
              OverWrite: true

          - task: ArchiveFiles@2
            displayName: "Create CI Deploy package"
            inputs:
              rootFolderOrFile: "$(publishOutput)"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(octopusPackageOutput)/$(ciAppPackageId).$(Build.BuildNumber).zip"
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: "Publish CI package artifact"
            inputs:
              targetPath: "$(octopusPackageOutput)"
              artifact: drop-ci

      - job: BuildReactApp
        displayName: "Build and package XbyK React SSR App"
        steps:
          - checkout: GWT.XbyK.ReactServer
            fetchDepth: 0
          - checkout: GWT.XbyK.UI
            fetchDepth: 0

          - task: UseNode@1
            displayName: "Install Node.js 22"
            inputs:
              version: "22.x"

          - task: Npm@1
            displayName: "Install GWT-ReactServer dependencies"
            inputs:
              command: "install"
              workingDir: "$(Build.SourcesDirectory)/GWT.XbyK.ReactServer"

          - task: Npm@1
            displayName: "Install GWT-UI dependencies"
            inputs:
              command: "install"
              workingDir: "$(Build.SourcesDirectory)/GWT.XbyK.UI"

          - task: Npm@1
            displayName: "Build React SSR App"
            inputs:
              command: "custom"
              workingDir: "$(Build.SourcesDirectory)/GWT.XbyK.ReactServer"
              customCommand: "run build"
          # The Fastify node has dependencies that are required at runtime, so we need to include the node_modules in the package. We copy them to the build output folder before packaging.
          - task: CopyFiles@2
            displayName: "Copy Node.js metadata files to build directory"
            inputs:
              SourceFolder: "$(Build.SourcesDirectory)/GWT.XbyK.ReactServer"
              Contents: |
                node_modules/**
              TargetFolder: "$(Build.SourcesDirectory)/GWT.XbyK.ReactServer/build"
              OverWrite: true

          - task: ArchiveFiles@2
            displayName: "Package XbyK React SSR App"
            inputs:
              rootFolderOrFile: "$(Build.SourcesDirectory)/GWT.XbyK.ReactServer/build"
              includeRootFolder: false
              archiveType: "zip"
              archiveFile:
                "$(Build.ArtifactStagingDirectory)/packages/$(reactAppPackageId).$\
                (Build.BuildNumber).zip"
              replaceExistingArchive: true
              verbose: true

          - task: PublishPipelineArtifact@1
            displayName: "Publish XbyK React App package artifact"
            inputs:
              targetPath: "$(octopusPackageOutput)"
              artifact: drop-react

  - stage: Publish
    displayName: Publish to Octopus
    dependsOn: [Versioning, Build]
    variables:
      releaseNumber: $[
        stageDependencies.Versioning.SetVersion.outputs['setVersion.releaseNumber']
        ]
      octopusChannel: $[
        stageDependencies.Versioning.SetVersion.outputs['setVersion.octopusChannel']
        ]
      isStable: $[
        stageDependencies.Versioning.SetVersion.outputs['setVersion.isStable'] ]
      triggerDetails: $[
        stageDependencies.Versioning.SetVersion.outputs['setVersion.triggerDetails']
        ]
    jobs:
      - job: Publish
        displayName: Publish to Octopus
        pool:
          vmImage: ubuntu-latest
        steps:
          - download: current
            displayName: "Download CMS package artifact"
            artifact: drop-cms
          - download: current
            displayName: "Download MVC package artifact"
            artifact: drop-mvc
          - download: current
            displayName: "Download React App package artifact"
            artifact: drop-react
          - download: current
            displayName: "Download CI Deploy package artifact"
            artifact: drop-ci

          - task: OctopusPush@7
            displayName: Push Packages to Octopus
            inputs:
              OctoConnectedServiceName: "Octopus Cloud"
              Space: "$(octopusSpaceName)"
              Packages: |
                $(Pipeline.Workspace)/drop-cms/*.zip
                $(Pipeline.Workspace)/drop-mvc/*.zip
                $(Pipeline.Workspace)/drop-react/*.zip
                $(Pipeline.Workspace)/drop-ci/*.zip
              Replace: "true"

          - task: OctopusBuildInformation@7
            displayName: Push Package Build Information to Octopus
            inputs:
              OctoConnectedServiceName: "Octopus Cloud"
              Space: "$(octopusSpaceName)"
              PackageIds: |
                $(cmsAppPackageId)
                $(mvcAppPackageId)
                $(reactAppPackageId)
                $(ciAppPackageId)
              PackageVersion: "$(Build.BuildNumber)"
              Replace: OverwriteExisting

          # Create release on 'Pre-Release' channel for main branch, and 'Stable' channel for Release/* branches
          - task: OctopusCreateRelease@7
            displayName: Create Octopus Release on Pre-Release Channel
            condition: and(succeeded(), ne(variables['isStable'], 'true'))
            continueOnError: true
            inputs:
              OctoConnectedServiceName: "Octopus Cloud"
              Space: "$(octopusSpaceName)"
              Project: "$(octopusProjectName)"
              ReleaseNumber: "$(Build.BuildNumber)"
              Channel: "Pre-Release"
              DefaultPackageVersion: "$(Build.BuildNumber)"
              GitRef: "$(Build.SourceBranch)"
              ReleaseNotes:
                "**Triggered by:** $(triggerDetails)<br>**Last GWT.XbyK.Web
                Commit:** $(Build.SourceVersionMessage)<br>**Build Reason:**
                $(Build.Reason)<br>**Link:** $(Build.Repository.Uri)"

          - task: OctopusCreateRelease@7
            displayName: Create Octopus Release on Stable Channel
            condition: and(succeeded(), eq(variables['isStable'], 'true'))
            inputs:
              OctoConnectedServiceName: "Octopus Cloud"
              Space: "$(octopusSpaceName)"
              Project: "$(octopusProjectName)"
              ReleaseNumber: "$(Build.BuildNumber)"
              Channel: "Stable"
              DefaultPackageVersion: "$(Build.BuildNumber)"
              GitRef: "$(Build.SourceBranch)"
              ReleaseNotes:
                "**Triggered by:** $(triggerDetails)<br>**Last GWT.XbyK.Web Commit
                Msg:** $(Build.SourceVersionMessage)<br>**Build Reason:**
                $(Build.Reason)<br>**Link:** $(Build.Repository.Uri)"
