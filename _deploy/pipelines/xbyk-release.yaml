# XbyK Web Publish and Release Pipeline
# Builds, packages, and pushes GWTXbyKWeb to Octopus Deploy, then creates a release.

name: XbyK Web Publish and Release

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - _deploy/*

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'
  projectFile: 'GWTXbyKWeb.csproj'
  packageId: 'GWTXbyKWeb'
  publishOutput: '$(Build.ArtifactStagingDirectory)/publish'
  octopusPackageOutput: '$(Build.ArtifactStagingDirectory)/packages'

  # Override these in your pipeline variable group or pipeline UI:
  # octopusServerUrl     - e.g. https://your-octopus-server
  # octopusApiKey        - secret variable; Octopus API key
  # octopusSpaceId       - default: 'Spaces-1'
  # octopusProjectName   - the Octopus project to release to
  # octopusEnvironment   - optional: environment to deploy to after release creation

jobs:
  - job: BuildAndPublish
    displayName: 'Build, Publish, and Push to Octopus'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      # ── 1. Install .NET SDK ────────────────────────────────────────────────
      - task: UseDotNet@2
        displayName: 'Use .NET $(dotnetVersion)'
        inputs:
          packageType: 'sdk'
          version: '$(dotnetVersion)'
          installationPath: $(Agent.ToolsDirectory)/dotnet

      # ── 2. Restore dependencies ────────────────────────────────────────────
      - script: dotnet restore $(projectFile)
        displayName: 'Restore NuGet packages'

      # ── 3. Build ───────────────────────────────────────────────────────────
      - script: >
          dotnet build $(projectFile)
          --configuration $(buildConfiguration)
          --no-restore
        displayName: 'Build $(projectFile)'

      # ── 4. Publish ─────────────────────────────────────────────────────────
      - script: >
          dotnet publish $(projectFile)
          --configuration $(buildConfiguration)
          --no-build
          --output $(publishOutput)
        displayName: 'Publish $(projectFile)'

      # ── 5. Pack for Octopus ────────────────────────────────────────────────
      - task: OctopusPack@4
        displayName: 'Pack for Octopus'
        inputs:
          PackageId: '$(packageId)'
          PackageFormat: 'Zip'
          PackageVersion: '$(Build.BuildNumber)'
          SourcePath: '$(publishOutput)'
          OutputPath: '$(octopusPackageOutput)'

      # ── 6. Publish pipeline artifact (optional – useful for auditing) ──────
      - task: PublishBuildArtifacts@1
        displayName: 'Publish pipeline artifact'
        inputs:
          PathtoPublish: '$(octopusPackageOutput)'
          ArtifactName: 'OctopusPackage'

      # ── 7. Push package to Octopus ─────────────────────────────────────────
      - task: OctopusPush@4
        displayName: 'Push package to Octopus'
        inputs:
          OctopusServerUrl: '$(octopusServerUrl)'
          ApiKey: '$(octopusApiKey)'
          Space: '$(octopusSpaceId)'
          Package: '$(octopusPackageOutput)/$(packageId).$(Build.BuildNumber).zip'
          OverwriteMode: 'OverwriteExisting'

      # ── 8. Create Octopus release ──────────────────────────────────────────
      - task: OctopusCreateRelease@4
        displayName: 'Create Octopus release'
        inputs:
          OctopusServerUrl: '$(octopusServerUrl)'
          ApiKey: '$(octopusApiKey)'
          Space: '$(octopusSpaceId)'
          Project: '$(octopusProjectName)'
          ReleaseNumber: '$(Build.BuildNumber)'
          Packages: '$(packageId):$(Build.BuildNumber)'
          # Uncomment the lines below to also deploy the release after creation:
          # DeployTo: '$(octopusEnvironment)'
          # WaitForDeployment: true
