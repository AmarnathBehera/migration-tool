# XbyK Build and Test Pipeline
# This pipeline is responsible for building the XbyK project and running tests.

name: XbyK Web Build and Test

variables:
  buildConfiguration: "Release"
  dotnetVersion: "10.x"

  # XbyK App project files
  cmsAppProjectFile: "$(Build.SourcesDirectory)/BDO.GWT.GLOBAL/GWTXbyKWeb.csproj"

stages:
  - stage: BuildAndTest
    displayName: Build and Test
    jobs:
      - job: SetVersion
        displayName: Set Version
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: gitversion-setup@4
            displayName: Install GitVersion
            inputs:
              versionSpec: "6.4.x"

          - task: gitversion-execute@4
            name: SetVersion
            displayName: Run GitVersion

          - script: |
              echo "Derived FullSemVer: $(GitVersion_FullSemVer)"
              newBuildNumber=$(echo "$(GitVersion_FullSemVer)" | sed 's/+/\./g')
              echo "##vso[build.updatebuildnumber]$newBuildNumber"
            displayName: Update build number

      - job: Build
        condition: true
        displayName: "Build and Test XbyK CMS App"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: UseDotNet@2
            displayName: "Use .NET $(dotnetVersion)"
            inputs:
              packageType: "sdk"
              version: "$(dotnetVersion)"
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - task: DotNetCoreCLI@2
            displayName: Restore CMS Web App
            inputs:
              command: "restore"
              restoreSolution: "$(Build.SourcesDirectory)/GWTXbyKWeb.slnx"
              feedsToUse: "select"

          - task: DotNetCoreCLI@2
            displayName: Build CMS Web App
            inputs:
              command: "build"
              projects: "$(Build.SourcesDirectory)/GWTXbyKWeb.slnx"

          - task: DotNetCoreCLI@2
            displayName: "Test CMS Web App with Code Coverage"
            inputs:
              command: "test"
              projects: "$(Build.SourcesDirectory)/GWTXbyKWeb.slnx"
              arguments: '--collect "Code Coverage"'
