# XbyK Validation Pipeline
# This pipeline is responsible for validating the XbyK project by running secret scanning and other checks

name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: pipelines-shared
      type: git
      name: Azure Environment/pipelines-shared
      ref: refs/heads/main

stages:
  - stage: Validation
    displayName: "Validation Stage"
    jobs:
      - template: .pipelines/templates/jobs/secretScanning.yml@pipelines-shared

      - job: SonarQube
        displayName: "SonarQube Cloud Analysis"
        steps:
          - checkout: self
            fetchDepth: 0

          - task: SonarCloudPrepare@3
            displayName: "Prepare SonarCloud Analysis"
            inputs:
              SonarCloud: "SonarCloud Connection"
              organization: "vsts-sonarcloud41751"
              scannerMode: "dotnet"
              projectName: "GWT.XbyK.Web"
              projectKey: "bdo_GWT.XbyK.Web"

          - task: NuGetToolInstaller@1
          - task: NuGetCommand@2
            inputs:
              command: "restore"
              restoreSolution: "$(Build.SourcesDirectory)/BDO.GWT.GLOBAL/GWTXbyKWeb.sln"
              feedsToUse: "select"

          - task: DotNetCoreCLI@2
            displayName: Build CMS Web App
            inputs:
              command: "build"
              projects: "$(Build.SourcesDirectory)/BDO.GWT.GLOBAL/GWTXbyKWeb.sln"

          - task: DotNetCoreCLI@2
            displayName: "Test CMS Web App with Code Coverage"
            inputs:
            command: "test"
            projects: "$(Build.SourcesDirectory)/BDO.GWT.GLOBAL/GWTXbyKWeb.sln"
            arguments: '--collect "Code Coverage"'
            
          - task: SonarCloudAnalyze@1
            displayName: "Run SonarCloud Analysis"

          - task: SonarCloudPublish@1
            displayName: "Publish SonarCloud Results"
            inputs:
              pollingTimeoutSec: 300