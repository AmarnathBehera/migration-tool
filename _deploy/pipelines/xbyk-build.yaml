# XbyK Build and Test Pipeline
# This pipeline is responsible for building the XbyK project and running tests.

name: XbyK Web Build and Test

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'
  
  # XbyK App project files
  cmsAppProjectFile: 'BDO.GWT.GLOBAL/GWTXbyKWeb.csproj'

stages:
  - stage: BuildAndTest
    displayName: Build and Test
    jobs:
      - job: Build
        condition: true
        displayName: 'Build XbyK CMS App DotNet project'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET $(dotnetVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - script: dotnet restore $(projectFile)
            displayName: 'Restore NuGet packages'

          - script: >
              dotnet build $(projectFile)
              --configuration $(buildConfiguration)
              --no-restore
            displayName: 'Build $(projectFile)'

      - job: Test
        condition: false # Temporarily disable tests until they are fixed
        displayName: 'Run Tests for XbyK CMS App DotNet project'
        dependsOn: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'
              installationPath: $(Agent.ToolsDirectory)/dotnet

          - script: |
              dotnet test $(cmsAppProjectFile).Tests.csproj --configuration $(buildConfiguration) --no-build
            displayName: 'Run Tests'
