# XbyK Build and Test Pipeline
# This pipeline is responsible for building the XbyK project and running tests.

name: XbyK Web Build and Test

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'
  projectFile: 'GWTXbyKWeb.csproj'

jobs:
  - job: Build
    displayName: 'Build XbyK Web project'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseDotNet@2
        displayName: 'Use .NET $(dotnetVersion)'
        inputs:
          packageType: 'sdk'
          version: '$(dotnetVersion)'
          installationPath: $(Agent.ToolsDirectory)/dotnet

      - script: dotnet restore $(projectFile)
        displayName: 'Restore NuGet packages'

      - script: >
          dotnet build $(projectFile)
          --configuration $(buildConfiguration)
          --no-restore
        displayName: 'Build $(projectFile)'

  - job: Test
    displayName: 'Run Tests for XbyK Web project'
    dependsOn: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '$(dotnetVersion)'
          installationPath: $(Agent.ToolsDirectory)/dotnet

      - script: |
          dotnet test GWTXbyKWeb.Tests.csproj --configuration $(buildConfiguration) --no-build
        displayName: 'Run Tests'
